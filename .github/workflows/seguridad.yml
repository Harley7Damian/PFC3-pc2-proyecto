name: Seguridad

# DevSecOps: secretos expuestos (gitleaks), analisis estatico (CodeQL) y configuracion de produccion de Django.
# Las dependencias (pip-audit) y bandit ya corren en ci.yml.
on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secretos:
    name: Secretos expuestos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo con todo el historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Buscar secretos en el historial completo
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  codeql:
    name: Analisis estatico del codigo (CodeQL)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  django-produccion:
    name: Configuracion de produccion (Django)
    runs-on: ubuntu-latest
    env:
      DEBUG: "0"
      ALLOWED_HOSTS: ejemplo.onrender.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generar una clave temporal aleatoria
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(60))')" >> "$GITHUB_ENV"
      - name: Revisar la configuracion de produccion
        shell: bash
        run: set -o pipefail && python manage.py check --deploy --fail-level WARNING 2>&1 | tee check-deploy.txt
      - name: Publicar el resultado en el resumen
        if: always()
        shell: bash
        run: |
          {
            echo "### Resultado de manage.py check --deploy"
            echo
            echo '```text'
            cat check-deploy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-deploy
          path: check-deploy.txt

  # Opcional: escaneo dinamico del sistema ya desplegado (OWASP ZAP). Descomentar con la URL real.
